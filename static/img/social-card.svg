<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="centerDot" x1="0" y1="0" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Grid decoration lines -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#312e81" stroke-width="1" stroke-opacity="0.3" />
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#312e81" stroke-width="1" stroke-opacity="0.3" />
  <line x1="400" y1="0" x2="400" y2="630" stroke="#312e81" stroke-width="1" stroke-opacity="0.3" />
  <line x1="800" y1="0" x2="800" y2="630" stroke="#312e81" stroke-width="1" stroke-opacity="0.3" />

  <!-- Logo Group -->
  <g transform="translate(100, 225)">
    <polygon points="56,15 124,15 165,56 165,124 124,165 56,165 15,124 15,56" fill="url(#logoGrad)" />
    <polygon points="68,41 112,41 139,68 139,112 112,139 68,139 41,112 41,68" fill="#0f172a" />
    <circle cx="90" cy="90" r="18" fill="url(#centerDot)" />
    <line x1="90" y1="41" x2="90" y2="72" stroke="#818cf8" stroke-width="6" stroke-linecap="round"/>
    <line x1="90" y1="108" x2="90" y2="139" stroke="#818cf8" stroke-width="6" stroke-linecap="round"/>
    <line x1="41" y1="90" x2="72" y2="90" stroke="#818cf8" stroke-width="6" stroke-linecap="round"/>
    <line x1="108" y1="90" x2="139" y2="90" stroke="#818cf8" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="320" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
    Octacity Docs
  </text>
  <text x="320" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="400" fill="#cbd5e1">
    Açık kaynak projeler için pratik ve açık fikirli rehber.
  </text>
  <text x="320" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#818cf8">
    docs.octacity.dev
  </text>
</svg>
